name: CI

on:
  pull_request:
  push:
    paths-ignore:
      - 'dist/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  windows-git:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Windows Git tests
        shell: pwsh
        run: |
          $output = & node --test tests/git.test.js tests/git-runner.test.js 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $details = $output -join "`n"
            if ($details.Length -gt 3500) {
              $details = $details.Substring($details.Length - 3500)
            }
            $annotation = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Git tests failed::$annotation"
            exit $exitCode
          }

  publish:
    # The npm trusted publisher for claude-hud-enhanced is registered against this workflow file, so the publish step lives here: tag pushes run CI, and only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-git]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (trusted publishing, no token)
        # Blank tokens so an inherited value cannot reintroduce token auth in place of the OIDC exchange.
        env:
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
        run: npm publish
